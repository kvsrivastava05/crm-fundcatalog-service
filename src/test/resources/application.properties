# Tests run against in-memory H2 (PostgreSQL mode) — no external database needed.
spring.datasource.url=jdbc:h2:mem:catalogtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-test-secret-test-secret-32bytes!!
app.cors.allowed-origin=*

# Dead URL so any context-wired AMFI fetch fails fast (no network in tests); the success path is
# tested with a local HttpServer in NavIngestionServiceTest.
app.amfi.nav-url=http://127.0.0.1:1/none
